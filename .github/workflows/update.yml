name: Update plans feed

on:
  schedule:
    # Каждый день в 00:00 МСК (21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SVG renderer and ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin imagemagick

      - name: Build feed and plan images
        run: |
          cat > build_feed.py <<'PY'
          #!/usr/bin/env python3
          """Собирает ladozhsky_plans.yml и картинки карточек в каталог out_dir.

          Источник: psk-info.ru API (проект Ladozhsky, project=2).
          Для каждого лота: описание, план квартиры, карточка расположения на этаже
          (план этажа с подсвеченной квартирой) и 5 рендеров проекта.

          Выборка: свободные лоты с ценой, самый дешевый лот на каждую площадь,
          затем равномерно ITEMS позиций по диапазону площадей.
          """

          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from xml.sax.saxutils import escape

          API_BASE = "https://psk-info.ru/api/flats/?format=json"
          PROJECTS_URL = "https://psk-info.ru/api/projects/?format=json"
          PAGE_SIZE = 100
          PROJECT_ID = 2
          ITEMS = 10
          RENDERS = 5
          SHOP_URL = "https://ladoczsky.avenirspb.ru/"
          PICTURE_BASE = "https://raw.githubusercontent.com/stasfactoryads-cloud/ladozhsky-avenir-feed/main/plans/"
          MSK_TZ = timezone(timedelta(hours=3))
          IMAGEMAGICK = "magick" if shutil.which("magick") else "convert"


          def fetch_bytes(url, attempts=4):
              """Загрузка с повторами: API и хранилище иногда рвут соединение."""
              for attempt in range(1, attempts + 1):
                  try:
                      req = urllib.request.Request(url, headers={"Accept": "application/json"})
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          return resp.read()
                  except OSError:
                      if attempt == attempts:
                          raise


          def get_json(url):
              return json.loads(fetch_bytes(url).decode("utf-8"))


          def fetch_all_flats():
              flats, offset, total = [], 0, None
              while True:
                  data = get_json(f"{API_BASE}&limit={PAGE_SIZE}&offset={offset}")
                  if total is None:
                      total = data.get("count", 0)
                  results = data.get("results", [])
                  if not results:
                      break
                  flats.extend(results)
                  offset += PAGE_SIZE
                  if offset >= total:
                      break
              return flats


          def pick_items(flats):
              free = [
                  f for f in flats
                  if f.get("project") == PROJECT_ID and f.get("status") == "Свободно"
                  and f.get("price") and f["price"] > 0
              ]
              cheapest = {}
              for f in free:
                  area = round(f["area"], 2)
                  if area not in cheapest or f["price"] < cheapest[area]["price"]:
                      cheapest[area] = f
              unique = [cheapest[a] for a in sorted(cheapest)]
              if len(unique) <= ITEMS:
                  return unique
              step = (len(unique) - 1) / (ITEMS - 1)
              return [unique[round(i * step)] for i in range(ITEMS)]


          def project_renders():
              """Первые RENDERS изображений проекта из галереи на сайте."""
              project = next(p for p in get_json(PROJECTS_URL) if p["id"] == PROJECT_ID)
              images = sorted(project.get("slider_images") or [], key=lambda x: x.get("order", 0))
              return [img["image"] for img in images if img.get("image")][:RENDERS]


          def render_png(svg_path, png_path):
              """SVG в квадрат 1200x1200 с белыми полями."""
              subprocess.run(
                  ["rsvg-convert", "-w", "1200", "-h", "1200", "-a", "-b", "white", "-f", "png", "-o", png_path, svg_path],
                  check=True,
              )
              subprocess.run(
                  [IMAGEMAGICK, png_path, "-background", "white", "-gravity", "center",
                   "-extent", "1200x1200", png_path],
                  check=True,
              )


          def render_plan(flat, plans_dir):
              svg_path = os.path.join(plans_dir, f"{flat['id']}.svg")
              png_path = os.path.join(plans_dir, f"{flat['id']}.png")
              with open(svg_path, "wb") as fh:
                  fh.write(fetch_bytes(flat["plan"]))
              render_png(svg_path, png_path)
              os.remove(svg_path)


          def render_floor(flat, plans_dir):
              """План этажа с подсвеченной квартирой (полигон floor_plan_hover)."""
              svg = fetch_bytes(flat["floor_plan"]).decode("utf-8")
              # Кадрируем viewBox по зданию, чтобы план занимал больше места в карточке
              svg = re.sub(r'viewBox="[^"]+"', 'viewBox="20 6 740 300"', svg, count=1)
              hover = flat.get("floor_plan_hover") or ""
              hover = hover.replace(
                  "<polygon ",
                  '<polygon fill="#ff6245" fill-opacity="0.9" stroke="#ff6245" stroke-width="2" ',
                  1,
              )
              svg = svg.replace("</svg>", hover + "</svg>")
              svg_path = os.path.join(plans_dir, f"{flat['id']}-floor.svg")
              png_path = os.path.join(plans_dir, f"{flat['id']}-floor.png")
              with open(svg_path, "w", encoding="utf-8") as fh:
                  fh.write(svg)
              render_png(svg_path, png_path)
              os.remove(svg_path)


          def lot_description(flat):
              """Описание конкретного лота: все поля уникальны из-за номера, этажа и площади."""
              area = f"{flat['area']:.2f}".rstrip("0").rstrip(".")
              finishing = flat.get("finishing") or "С отделкой"
              features = flat.get("features") or []
              parts = [
                  f"Апартаменты {area} м² на {flat.get('floor')} этаже из {flat.get('max_floor')}, "
                  f"корпус {flat.get('building') or '1'}, номер {flat.get('number')}.",
                  f"{finishing}.",
              ]
              if features:
                  parts.append("Особенности: " + ", ".join(f.lower() for f in features) + ".")
              parts.append(
                  "Апарт-отель бизнес-класса Ladozhsky AVENIR от ГК «ПСК». "
                  "До метро «Ладожская» 10 минут пешком. Управление номером: PSK INVEST."
              )
              return " ".join(parts)


          def offer_xml(flat, pictures):
              area = f"{flat['area']:.2f}".rstrip("0").rstrip(".")
              finishing = flat.get("finishing") or "С отделкой"
              pictures_xml = "\n".join(f"  <picture>{escape(p)}</picture>" for p in pictures)
              return "\n".join([
                  f'<offer id="{flat["id"]}" available="true">',
                  f"  <name>{escape(f'Апартаменты {area} м²')}</name>",
                  f"  <url>{escape(SHOP_URL)}</url>",
                  pictures_xml,
                  f"  <price>{int(round(flat['price']))}</price>",
                  "  <currencyId>RUR</currencyId>",
                  "  <categoryId>1</categoryId>",
                  f"  <description>{escape(lot_description(flat))}</description>",
                  f'  <param name="Площадь">{area} м²</param>',
                  f'  <param name="Этаж">{flat.get("floor")} из {flat.get("max_floor")}</param>',
                  f'  <param name="Отделка">{escape(finishing)}</param>',
                  f'  <param name="Корпус">{escape(str(flat.get("building") or "-"))}</param>',
                  f'  <param name="Номер">{escape(str(flat.get("number") or "-"))}</param>',
                  "</offer>",
              ])


          def build_yml(offers, now):
              return (
                  '<?xml version="1.0" encoding="UTF-8"?>\n'
                  f"<!-- Обновлено: {now} МСК. Источник: psk-info.ru, проект Ladozhsky AVENIR -->\n"
                  f'<yml_catalog date="{now}">\n<shop>\n'
                  "  <name>Ladozhsky AVENIR</name>\n"
                  "  <company>Группа компаний ПСК</company>\n"
                  f"  <url>{escape(SHOP_URL)}</url>\n"
                  '  <currencies><currency id="RUR" rate="1"/></currencies>\n'
                  '  <categories><category id="1">Апартаменты</category></categories>\n'
                  f"  <offers>\n{chr(10).join(offers)}\n  </offers>\n</shop>\n</yml_catalog>\n"
              )


          def main(out_dir):
              plans_dir = os.path.join(out_dir, "plans")
              if os.path.isdir(plans_dir):
                  shutil.rmtree(plans_dir)
              os.makedirs(plans_dir)

              items = pick_items(fetch_all_flats())
              if not items:
                  sys.exit("Нет свободных лотов, фид не обновлен")

              renders = project_renders()
              offers = []
              for item in items:
                  flat = get_json(f"https://psk-info.ru/api/flats/{item['id']}/?format=json")
                  render_plan(flat, plans_dir)
                  render_floor(flat, plans_dir)
                  pictures = [
                      PICTURE_BASE + f"{flat['id']}.png",
                      PICTURE_BASE + f"{flat['id']}-floor.png",
                      *renders,
                  ]
                  offers.append(offer_xml(flat, pictures))

              now = datetime.now(MSK_TZ).strftime("%Y-%m-%d %H:%M")
              with open(os.path.join(out_dir, "ladozhsky_plans.yml"), "w", encoding="utf-8") as fh:
                  fh.write(build_yml(offers, now))
              print(f"Позиций в фиде: {len(items)}, рендеров проекта: {len(renders)}")


          if __name__ == "__main__":
              main(sys.argv[1] if len(sys.argv) > 1 else ".")
          PY
          python3 build_feed.py .
          rm build_feed.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A ladozhsky_plans.yml plans
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Update plans feed $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
